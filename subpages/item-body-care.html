<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body Care | inim-dx</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body data-root=".." data-page-key="itemBodyCare">
    <main id="page-main">
        <section class="section catalog-page">
            <div class="catalog-hero catalog-hero--single">
                <article class="catalog-hero__copy">
                    <p class="section-kicker">Items / Hand Cream</p>
                    <h2>ハンドクリーム <small>Hand Cream</small></h2>
                    <p>香りと保湿のバランスを重視した3種類のハンドクリームを公開しています。日中のリフレッシュから就寝前のケアまで、用途別に選べます。</p>
                    <div class="catalog-hero__meta">
                        <span>3種類</span>
                        <span>保湿ケア</span>
                        <span>ギフト向け</span>
                    </div>
                </article>
            </div>

            <section>
                <div class="section-heading">
                    <p class="section-kicker">Lineup</p>
                    <h2>ハンドクリーム ラインアップ</h2>
                </div>
                <div class="catalog-grid">
                    <article class="catalog-card">
                        <img src="../images/inim-dx_items/handcream_rose.png" alt="Hand Cream Rose">
                        <h3>Rose <small>ローズ</small></h3>
                        <p>華やかさとやわらかさのバランスがよく、日常使いしやすい定番の香りです。</p>
                    </article>
                    <article class="catalog-card">
                        <img src="../images/inim-dx_items/handcream_daphne.png" alt="Hand Cream Daphne">
                        <h3>Daphne <small>ダフネ</small></h3>
                        <p>穏やかなフローラル感で、仕事中でも強すぎず上品に残る印象をつくります。</p>
                    </article>
                    <article class="catalog-card">
                        <img src="../images/inim-dx_items/handcream_seablue.png" alt="Hand Cream Sea Blue">
                        <h3>Sea Blue <small>シーブルー</small></h3>
                        <p>軽い清涼感で気分を切り替えやすく、季節を問わず使いやすい仕上がりです。</p>
                    </article>
                </div>
            </section>
        </section>
    </main>
    <script src="../js/site-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/site-shell.js"></script>
</body>

</html>
