<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter | inim-dx</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body data-root=".." data-page-key="newsletter">
    <main id="page-main">
        <section class="section content-hub-page">
            <div class="section-heading">
                <p class="section-kicker">Newsletter</p>
                <h2>メルマガ登録・解除</h2>
                <p class="content-hub-lead">新着記事、イベント、限定オファーを受け取るための設定案内ページです。</p>
            </div>

            <div class="policy-grid">
                <article class="policy-card">
                    <h3>配信内容</h3>
                    <p>ワークショップ情報、季節の香り提案、限定商品の案内を月1-2回配信します。</p>
                </article>
                <article class="policy-card">
                    <h3>登録方法</h3>
                    <p>会員登録後、アカウント設定から配信希望をオンにすると受信対象になります。</p>
                </article>
                <article class="policy-card">
                    <h3>解除方法</h3>
                    <p>配信メール末尾リンク、またはアカウント設定画面からいつでも解除できます。</p>
                </article>
            </div>
            <div class="content-hub-actions">
                <a class="button button--secondary" href="./account.html#account" data-account-modal="account">設定を開く</a>
                <a class="button button--ghost" href="./contact.html">配信について問い合わせる</a>
            </div>
        </section>
    </main>
    <script src="../js/site-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/site-shell.js"></script>
</body>

</html>
