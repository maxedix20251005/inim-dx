<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sale | inim-dx</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body data-root=".." data-page-key="sale">
    <main id="page-main">
        <section class="section content-hub-page">
            <div class="section-heading">
                <p class="section-kicker">Sale</p>
                <h2>セール / 限定オファー</h2>
                <p class="content-hub-lead">体験導線と相性がよい限定セットを、期間・対象別に確認できるページです。</p>
            </div>

            <div class="content-hub-grid">
                <article class="content-hub-card">
                    <img src="../images/inim-dx_watoyo/WATOYO_WA.png" alt="WAtoYO 限定オファー">
                    <p class="content-hub-card__meta">期間限定</p>
                    <h3>WAtoYO トライアルセット</h3>
                    <p>WA / YO / WAYO の比較導入に向いたセット。香りの方向性を試しやすい構成です。</p>
                    <a class="button button--secondary" href="./brand-watoyo.html">ブランドを見る</a>
                </article>
                <article class="content-hub-card">
                    <img src="../images/inim-dx_items/aroma_neroli.png" alt="アロマセット">
                    <p class="content-hub-card__meta">アロマ</p>
                    <h3>アロマ 2本セレクト</h3>
                    <p>日中用と夜用を組み合わせる方向けのセット。生活シーン別に使い分けできます。</p>
                    <a class="button button--secondary" href="./item-home-fragrance.html">アロマを見る</a>
                </article>
                <article class="content-hub-card">
                    <img src="../images/inim-dx_items/handcream_rose.png" alt="ハンドクリームセット">
                    <p class="content-hub-card__meta">ハンドクリーム</p>
                    <h3>ハンドクリーム ギフトパック</h3>
                    <p>ローズ / ダフネ / シーブルーから選べるギフト向けパック。店頭受取にも対応予定です。</p>
                    <a class="button button--secondary" href="./item-body-care.html">ハンドクリームを見る</a>
                </article>
            </div>
        </section>
    </main>
    <script src="../js/site-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/site-shell.js"></script>
</body>

</html>
