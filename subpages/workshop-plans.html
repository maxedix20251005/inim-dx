<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ワークショッププラン | inim-dx</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/workshop.css">
    <link rel="icon" href="../images/logo/logo-inim-dx.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body data-root=".." data-page-key="workshop">
    <main id="page-main">
        <section class="section">
            <div class="section-heading">
                <p class="section-kicker">Workshop Plans</p>
                <h2>プラン一覧</h2>
            </div>
            <div class="workshop-program-grid">
                <article class="workshop-program-card workshop-program-card--image-last">
                    <div class="workshop-program-card__body">
                        <h3>Quick Trial</h3>
                        <p>短時間で香りの方向性を見つける導入プラン。</p>
                        <div class="workshop-program-card__meta">
                            <span>45分</span>
                            <span>5,500円〜</span>
                        </div>
                        <div class="workshop-program-card__actions">
                            <a class="button button--primary" href="./workshop-booking.html">このプランで予約</a>
                        </div>
                    </div>
                    <img src="../images/Workshop/Workshop_ (5).png" alt="Quick Trial">
                </article>
                <article class="workshop-program-card">
                    <div class="workshop-program-card__intro">
                        <span class="workshop-program-card__eyebrow">Most Popular</span>
                        <h3>Signature Blend</h3>
                        <p>人気の標準プラン。迷ったらここから。</p>
                    </div>
                    <div class="workshop-program-card__details">
                        <div class="workshop-program-card__meta">
                            <span>60分〜75分</span>
                            <span>6,600円〜</span>
                        </div>
                        <div class="workshop-program-card__actions">
                            <a class="button button--primary" href="./workshop-booking.html">このプランで予約</a>
                        </div>
                    </div>
                </article>
                <article class="workshop-program-card workshop-program-card--image-last">
                    <div class="workshop-program-card__body">
                        <h3>Gift Workshop</h3>
                        <p>ペア・記念日に向くギフト体験プラン。</p>
                        <div class="workshop-program-card__meta">
                            <span>75分〜90分</span>
                            <span>10,000円〜</span>
                        </div>
                        <div class="workshop-program-card__actions">
                            <a class="button button--primary" href="./workshop-booking.html">このプランで予約</a>
                        </div>
                    </div>
                    <img src="../images/Workshop/Workshop_ (7).png" alt="Gift Workshop">
                </article>
            </div>
        </section>
    </main>
    <script src="../js/site-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/site-shell.js"></script>
</body>

</html>
