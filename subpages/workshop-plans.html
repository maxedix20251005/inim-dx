<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ワークショッププラン | inim-dx</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/workshop.css">
    <link rel="icon" href="../images/logo/logo-inim-dx.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body data-root=".." data-page-key="workshop">
    <main id="page-main">
        <section class="section workshop-programs">
            <div class="section-heading workshop-program-heading">
                <p class="section-kicker">Workshop Plans</p>
                <h2>プラン一覧</h2>
            </div>
            <section class="workshop-plan-controls" aria-label="プラン比較フィルタ">
                <div class="workshop-plan-controls__chips" id="plan-filter-chips">
                    <button type="button" class="is-active" data-filter="all">すべて</button>
                    <button type="button" data-filter="short">短時間で体験</button>
                    <button type="button" data-filter="deep">じっくり体験</button>
                    <button type="button" data-filter="pair">ペア・ギフト向け</button>
                </div>
                <label class="workshop-plan-controls__sort" for="plan-sort">
                    並び順
                    <select id="plan-sort">
                        <option value="recommended">おすすめ順</option>
                        <option value="price_asc">価格が低い順</option>
                        <option value="duration_asc">所要時間が短い順</option>
                    </select>
                </label>
            </section>
            <p id="plans-status" class="plans-status">Loading plans...</p>
            <div class="workshop-program-grid" id="plans-grid"></div>
            <div class="workshop-plan-cta">
                <a class="button button--primary" id="plans-next-cta" href="./workshop-booking.html">予約枠を確認して予約へ進む</a>
            </div>
        </section>
        <aside class="workshop-sticky-next" aria-label="次のアクション">
            <p class="workshop-sticky-next__text">次の一歩: 予約枠を確認</p>
            <a class="button button--primary" id="plans-sticky-next-cta" href="./workshop-booking.html">予約枠を確認する</a>
        </aside>
    </main>

    <script src="../js/site-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/site-shell.js"></script>
    <script>
        (() => {
            const cfg = window.INIM_SITE_CONFIG || {};
            const sbApi = window.supabase || null;
            const supabase = cfg.supabaseUrl && cfg.supabasePublishableKey && sbApi?.createClient
                ? sbApi.createClient(cfg.supabaseUrl, cfg.supabasePublishableKey)
                : null;

            const statusEl = document.getElementById("plans-status");
            const gridEl = document.getElementById("plans-grid");
            const filterHost = document.getElementById("plan-filter-chips");
            const sortSelect = document.getElementById("plan-sort");
            if (!statusEl || !gridEl || !filterHost || !sortSelect) return;
            const search = new URLSearchParams(window.location.search);
            const requestedStore = String(search.get("store") || "").trim();
            const requestedStoreLabel = String(search.get("storeLabel") || "").trim();

            const defaultImage = "../images/Workshop/Workshop_ (6).png";
            const fallbackImages = [
                "../images/Workshop/Workshop_ (9-1).png",
                "../images/Workshop/Workshop_ (2-1).png",
                "../images/Workshop/Workshop_ (7).png"
            ];

            let allPlans = [];
            let currentFilter = "all";
            let currentSort = "recommended";

            const toYen = (v) => `¥${Number(v || 0).toLocaleString("ja-JP")}`;
            const escapeHtml = (v) => String(v ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");

            const resolveImage = (url, index) => {
                const candidate = String(url || "").trim();
                if (candidate) return candidate;
                return fallbackImages[index % fallbackImages.length] || defaultImage;
            };

            const buildBookingHref = (plan) => {
                const target = new URL("./workshop-booking.html", window.location.href);
                target.searchParams.set("planId", plan.id || "");
                target.searchParams.set("planCode", plan.plan_code || "");
                target.searchParams.set("planName", plan.plan_name || "");
                if (requestedStore) target.searchParams.set("store", requestedStore);
                if (requestedStoreLabel) target.searchParams.set("storeLabel", requestedStoreLabel);
                return target.toString();
            };

            const maxDuration = (plan) => Number(plan.duration_max_minutes || plan.duration_min_minutes || 0);
            const minPrice = (plan) => Number(plan.base_price_jpy || 0);
            const maxParty = (plan) => Number(plan.max_party_size || 1);
            const isPairLike = (plan) => {
                const text = `${plan.plan_code || ""} ${plan.plan_name || ""} ${plan.plan_summary || ""}`.toLowerCase();
                return maxParty(plan) >= 2 || text.includes("gift") || text.includes("pair") || text.includes("ペア") || text.includes("ギフト");
            };

            const applyFilter = (plans) => {
                if (currentFilter === "short") return plans.filter((p) => maxDuration(p) > 0 && maxDuration(p) <= 50);
                if (currentFilter === "deep") return plans.filter((p) => maxDuration(p) >= 60);
                if (currentFilter === "pair") return plans.filter((p) => isPairLike(p));
                return plans;
            };

            const applySort = (plans) => {
                const cloned = [...plans];
                if (currentSort === "price_asc") {
                    cloned.sort((a, b) => minPrice(a) - minPrice(b));
                    return cloned;
                }
                if (currentSort === "duration_asc") {
                    cloned.sort((a, b) => maxDuration(a) - maxDuration(b));
                    return cloned;
                }
                cloned.sort((a, b) => Number(a.sort_order || 0) - Number(b.sort_order || 0));
                return cloned;
            };

            const applyView = (inclusionsByPlan = {}) => {
                const filtered = applyFilter(allPlans);
                const sorted = applySort(filtered);
                const hasSourceData = allPlans.length > 0;
                const viewPlans = sorted.length ? sorted : (hasSourceData ? [] : fallbackPlans);
                if (hasSourceData) {
                    statusEl.textContent = `${filtered.length} / ${allPlans.length} plans (filter: ${currentFilter}, sort: ${currentSort})${requestedStoreLabel ? ` / store: ${requestedStoreLabel}` : ""}`;
                }
                renderCards(viewPlans, inclusionsByPlan);
            };

            const fallbackPlans = [
                {
                    id: "fallback-quick",
                    plan_code: "quick_trial",
                    plan_name: "Quick Trial",
                    plan_summary: "短時間で香りの方向性を見つける体験プラン。",
                    duration_min_minutes: 45,
                    duration_max_minutes: 45,
                    base_price_jpy: 5500,
                    min_party_size: 1,
                    max_party_size: 2,
                    plan_image_url: "../images/Workshop/Workshop_ (9-1).png"
                },
                {
                    id: "fallback-signature",
                    plan_code: "signature_blend",
                    plan_name: "Signature Blend",
                    plan_summary: "人気のノートでオリジナルブレンドを作る体験。",
                    duration_min_minutes: 60,
                    duration_max_minutes: 75,
                    base_price_jpy: 6600,
                    min_party_size: 1,
                    max_party_size: 4,
                    plan_image_url: "../images/Workshop/Workshop_ (2-1).png"
                }
            ];

            const renderCards = (plans, inclusionsByPlan = {}) => {
                if (!plans.length) {
                    gridEl.innerHTML = `
                        <article class="workshop-program-card">
                            <div class="workshop-program-card__intro">
                                <h3>Plan data is not available</h3>
                                <p>現在表示できるプランデータがありません。</p>
                            </div>
                        </article>
                    `;
                    return;
                }

                gridEl.innerHTML = plans.map((plan, index) => {
                    const mins = Number(plan.duration_min_minutes || 0);
                    const maxs = Number(plan.duration_max_minutes || mins);
                    const points = (inclusionsByPlan[plan.id] || []).slice(0, 3);
                    const imageUrl = resolveImage(plan.plan_image_url, index);
                    const imageAlt = `${plan.plan_name || "Workshop Plan"} image`;
                    const durationText = `所要時間: 約${escapeHtml(String(mins))}分${maxs && maxs !== mins ? `から${escapeHtml(String(maxs))}分` : ""}`;
                    const priceText = `料金: ${escapeHtml(toYen(plan.base_price_jpy))}`;
                    const partyText = `人数: ${escapeHtml(String(plan.min_party_size || 1))}〜${escapeHtml(String(plan.max_party_size || 1))}名`;
                    const summaryText = escapeHtml(plan.plan_summary || plan.plan_description || "説明準備中です。");
                    const eyebrowText = escapeHtml(plan.plan_code || "PLAN");
                    const titleText = escapeHtml(plan.plan_name || "Workshop Plan");
                    const actionHref = buildBookingHref(plan);
                    const actionLabel = "このプランで予約に進む";

                    if (index % 3 === 1) {
                        return `
                            <article class="workshop-program-card">
                                <div class="workshop-program-card__intro">
                                    <span class="workshop-program-card__eyebrow">${eyebrowText}</span>
                                    <h3 class="workshop-program-card__title">${titleText}</h3>
                                    <p>${summaryText}</p>
                                </div>
                                <img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(imageAlt)}" loading="lazy">
                                <div class="workshop-program-card__details">
                                    <div class="workshop-program-card__meta">
                                        <span>${durationText}</span>
                                        <span>${priceText}</span>
                                        <span>${partyText}</span>
                                    </div>
                                    ${points.length ? `<ul class="workshop-program-card__points">${points.map((x) => `<li>${escapeHtml(x)}</li>`).join("")}</ul>` : ""}
                                    <div class="workshop-program-card__actions">
                                        <a class="button button--primary" href="${actionHref}">${actionLabel}</a>
                                    </div>
                                </div>
                            </article>
                        `;
                    }

                    return `
                        <article class="workshop-program-card workshop-program-card--image-last">
                            <div class="workshop-program-card__body">
                                <span class="workshop-program-card__eyebrow">${eyebrowText}</span>
                                <h3 class="workshop-program-card__title">${titleText}</h3>
                                <p>${summaryText}</p>
                                <div class="workshop-program-card__meta">
                                    <span>${durationText}</span>
                                    <span>${priceText}</span>
                                    <span>${partyText}</span>
                                </div>
                                ${points.length ? `<ul class="workshop-program-card__points">${points.map((x) => `<li>${escapeHtml(x)}</li>`).join("")}</ul>` : ""}
                                <div class="workshop-program-card__actions">
                                    <a class="button button--primary" href="${actionHref}">${actionLabel}</a>
                                </div>
                            </div>
                            <img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(imageAlt)}" loading="lazy">
                        </article>
                    `;
                }).join("");
            };

            const init = async () => {
                if (!supabase) {
                    statusEl.textContent = "Supabase not configured. Showing fallback plans.";
                    allPlans = [...fallbackPlans];
                    applyView({});
                    const bottomCta = document.getElementById("plans-next-cta");
                    const stickyCta = document.getElementById("plans-sticky-next-cta");
                    if (bottomCta && requestedStore) {
                        const target = new URL(bottomCta.getAttribute("href"), window.location.href);
                        target.searchParams.set("store", requestedStore);
                        if (requestedStoreLabel) target.searchParams.set("storeLabel", requestedStoreLabel);
                        bottomCta.href = target.toString();
                        if (stickyCta) stickyCta.href = target.toString();
                    }
                    return;
                }

                const { data: planRows, error: planErr } = await supabase
                    .from("workshop_plans")
                    .select("id, plan_code, plan_name, plan_summary, plan_description, plan_image_url, duration_min_minutes, duration_max_minutes, base_price_jpy, min_party_size, max_party_size, status, sort_order")
                    .eq("status", "active")
                    .order("sort_order", { ascending: true });

                if (planErr) {
                    statusEl.textContent = `Failed to load plans: ${planErr.message}`;
                    renderCards(fallbackPlans);
                    return;
                }

                const plans = planRows || [];
                allPlans = [...plans];
                const planIds = allPlans.map((x) => x.id).filter(Boolean);
                const inclusionsByPlan = {};

                if (planIds.length) {
                    const { data: inclusionRows } = await supabase
                        .from("workshop_plan_inclusions")
                        .select("plan_id, inclusion_text, display_order")
                        .in("plan_id", planIds)
                        .order("display_order", { ascending: true });

                    (inclusionRows || []).forEach((row) => {
                        inclusionsByPlan[row.plan_id] = inclusionsByPlan[row.plan_id] || [];
                        inclusionsByPlan[row.plan_id].push(row.inclusion_text);
                    });
                }

                if (!allPlans.length) {
                    statusEl.textContent = "No active plans found. Showing fallback plans.";
                    allPlans = [...fallbackPlans];
                }
                applyView(inclusionsByPlan);
                const bottomCta = document.getElementById("plans-next-cta");
                const stickyCta = document.getElementById("plans-sticky-next-cta");
                if (bottomCta && requestedStore) {
                    const target = new URL(bottomCta.getAttribute("href"), window.location.href);
                    target.searchParams.set("store", requestedStore);
                    if (requestedStoreLabel) target.searchParams.set("storeLabel", requestedStoreLabel);
                    bottomCta.href = target.toString();
                    if (stickyCta) stickyCta.href = target.toString();
                }

                filterHost.querySelectorAll("[data-filter]").forEach((button) => {
                    button.addEventListener("click", () => {
                        currentFilter = String(button.getAttribute("data-filter") || "all");
                        filterHost.querySelectorAll("[data-filter]").forEach((node) => node.classList.toggle("is-active", node === button));
                        applyView(inclusionsByPlan);
                    });
                });
                sortSelect.addEventListener("change", () => {
                    currentSort = String(sortSelect.value || "recommended");
                    applyView(inclusionsByPlan);
                });
            };

            init();
        })();
    </script>
</body>

</html>
