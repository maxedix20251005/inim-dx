<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ワークショップ予約完了 | inim-dx</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/workshop-booking-thanks.css">
    <link rel="icon" href="../images/logo/logo-inim-dx.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body data-root=".." data-page-key="workshopBookingThanks">
    <main id="page-main" class="thanks-page">
        <section class="thanks-hero">
            <div class="thanks-wrap">
                <p class="section-kicker">Workshop Booking Complete</p>
                <h1 class="thanks-hero__title">ご予約を受け付けました</h1>
                <p class="thanks-hero__lead">予約内容の控えを以下に表示しています。詳細確認や変更が必要な場合は店舗までお問い合わせください。</p>
            </div>
        </section>

        <section class="thanks-wrap">
            <section class="thanks-panel">
                <h2>予約情報</h2>
                <table class="thanks-table">
                    <tbody>
                        <tr><th>予約ID</th><td id="thanks-booking-id">-</td></tr>
                        <tr><th>予約ステータス</th><td id="thanks-booking-status">-</td></tr>
                        <tr><th>プラン</th><td id="thanks-plan">-</td></tr>
                        <tr><th>店舗</th><td id="thanks-store">-</td></tr>
                        <tr><th>予約日時</th><td id="thanks-booking-date">-</td></tr>
                        <tr><th>集合時間</th><td id="thanks-booking-gather">-</td></tr>
                        <tr><th>開始時間</th><td id="thanks-booking-start">-</td></tr>
                        <tr><th>終了時間</th><td id="thanks-booking-end">-</td></tr>
                        <tr><th>参加人数</th><td id="thanks-booking-party">-</td></tr>
                        <tr><th>料金</th><td id="thanks-booking-price">-</td></tr>
                    </tbody>
                </table>

                <div class="thanks-actions">
                    <a class="button button--primary" href="./workshop.html#reserve">ワークショップページへ戻る</a>
                    <a class="button button--secondary" href="../index.html">トップへ戻る</a>
                </div>
            </section>
        </section>
    </main>
    <script src="../js/site-config.js"></script>
    <script src="../js/site-shell.js"></script>
    <script>
        (() => {
            const params = new URLSearchParams(window.location.search);
            const byId = (id) => document.getElementById(id);
            const bookingId = params.get("booking_id") || "-";
            const status = params.get("status") || "-";
            const label = params.get("label") || params.get("date") || "-";
            const gather = params.get("gather") || "-";
            const party = params.get("party_size") || "-";
            const start = params.get("start_time") || "-";
            const end = params.get("end_time") || "-";
            const plan = params.get("plan") || "-";
            const store = params.get("store_label") || params.get("storeLabel") || params.get("store") || "-";
            const price = params.get("price") || "-";

            byId("thanks-booking-id").textContent = bookingId;
            byId("thanks-booking-status").textContent = status;
            byId("thanks-plan").textContent = plan;
            byId("thanks-store").textContent = store;
            byId("thanks-booking-date").textContent = label;
            byId("thanks-booking-gather").textContent = gather;
            byId("thanks-booking-start").textContent = start;
            byId("thanks-booking-end").textContent = end;
            byId("thanks-booking-party").textContent = party === "-" ? party : `${party}名`;
            byId("thanks-booking-price").textContent = price;
        })();
    </script>
</body>

</html>
