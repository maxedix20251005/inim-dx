<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSS / ATOM | inim-dx</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body data-root=".." data-page-key="rss">
    <main id="page-main">
        <section class="section policy-page">
            <div class="section-heading">
                <p class="section-kicker">RSS / ATOM</p>
                <h2>フィード配信</h2>
                <p class="content-hub-lead">記事・イベント更新をフィードで取得したい方向けの案内ページです（配信URLは公開準備中）。</p>
            </div>
            <div class="policy-grid">
                <article class="policy-card">
                    <h3>記事フィード</h3>
                    <p>記事カテゴリの更新通知を配信予定です。URLは公開時にこのページへ追加します。</p>
                </article>
                <article class="policy-card">
                    <h3>イベントフィード</h3>
                    <p>開催情報・受付開始の更新通知を配信予定です。</p>
                </article>
                <article class="policy-card">
                    <h3>利用ルール</h3>
                    <p>取得したフィードは個人利用範囲での参照を前提とし、再配布時は出典表記をお願いします。</p>
                </article>
            </div>
            <div class="content-hub-actions">
                <a class="button button--secondary" href="./search-projects.html">記事を見る</a>
                <a class="button button--ghost" href="./search-events.html">イベントを見る</a>
            </div>
        </section>
    </main>
    <script src="../js/site-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/site-shell.js"></script>
