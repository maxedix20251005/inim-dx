<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Items | inim-dx</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body data-root=".." data-page-key="items">
    <main id="page-main">
        <section class="section content-hub-page">
            <div class="section-heading">
                <p class="section-kicker">Items Hub</p>
                <h2>アイテム</h2>
                <p class="content-hub-lead">現在公開中の 2 グループ（アロマ / ハンドクリーム）を中心に、比較しやすい導線をまとめています。</p>
            </div>

            <div class="content-hub-grid content-hub-grid--items">
                <article class="content-hub-card content-hub-card--primary">
                    <img src="../images/inim-dx_items/aroma_neroli.png" alt="アロマ">
                    <p class="content-hub-card__meta">Aroma</p>
                    <h3>アロマ</h3>
                    <p>ネロリ・バニラ・ムスクの3ラインを公開中。シーン別に香りの方向性を比較できます。</p>
                    <a class="button button--secondary" href="./item-home-fragrance.html">アロマを見る</a>
                </article>
                <article class="content-hub-card content-hub-card--primary">
                    <img src="../images/inim-dx_items/handcream_rose.png" alt="ハンドクリーム">
                    <p class="content-hub-card__meta">Hand Cream</p>
                    <h3>ハンドクリーム</h3>
                    <p>ローズ・ダフネ・シーブルーの3ラインを公開中。香りとケアのバランスで選べます。</p>
                    <a class="button button--secondary" href="./item-body-care.html">ハンドクリームを見る</a>
                </article>
                <article class="content-hub-card">
                    <img src="../images/Workshop/Workshop_ (10).png" alt="体験導線">
                    <p class="content-hub-card__meta">Next Action</p>
                    <h3>体験・予約へ接続</h3>
                    <p>アイテム理解後にワークショップ体験へ進める導線を提供し、比較から予約までを短くつなげます。</p>
                    <a class="button button--ghost" href="./workshop-booking.html">予約導線へ</a>
                </article>
            </div>
        </section>
    </main>
    <script src="../js/site-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/site-shell.js"></script>
</body>

</html>
