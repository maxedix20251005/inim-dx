<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | inim-dx</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body data-root=".." data-page-key="login">
    <main id="page-main">
        <section class="section auth-page">
            <div class="section-heading">
                <p class="section-kicker">Login</p>
                <h2>ログイン</h2>
                <p class="content-hub-lead">予約履歴やアカウント設定へアクセスするためのログインページです。</p>
            </div>
            <div class="auth-panel">
                <label class="auth-field">
                    <span>メールアドレス</span>
                    <input type="email" placeholder="you@example.com" disabled>
                </label>
                <label class="auth-field">
                    <span>パスワード</span>
                    <input type="password" placeholder="********" disabled>
                </label>
                <p class="auth-note">フォーム送信は既存認証モーダルに統合されています。下のボタンからログインモーダルを開いてください。</p>
                <div class="content-hub-actions">
                    <a class="button button--primary" href="#login" data-account-modal="login">ログインモーダルを開く</a>
                    <a class="button button--secondary" href="./register.html">新規会員登録へ</a>
                </div>
            </div>
        </section>
    </main>
    <script src="../js/site-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/site-shell.js"></script>
</body>

</html>
