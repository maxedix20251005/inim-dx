<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Fragrance | inim-dx</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body data-root=".." data-page-key="itemHomeFragrance">
    <main id="page-main">
        <section class="section catalog-page">
            <div class="catalog-hero catalog-hero--single">
                <article class="catalog-hero__copy">
                    <p class="section-kicker">Items / Aroma</p>
                    <h2>アロマ <small>Aroma</small></h2>
                    <p>香りの芯を感じやすい3種類のアロマを公開しています。気分転換、就寝前、集中したい時間など、シーンに合わせて選べます。</p>
                    <div class="catalog-hero__meta">
                        <span>3種類</span>
                        <span>日常使い</span>
                        <span>初心者向け</span>
                    </div>
                </article>
            </div>

            <section>
                <div class="section-heading">
                    <p class="section-kicker">Lineup</p>
                    <h2>アロマ ラインアップ</h2>
                </div>
                <div class="catalog-grid">
                    <article class="catalog-card">
                        <img src="../images/inim-dx_items/aroma_neroli.png" alt="Aroma Neroli">
                        <h3>Neroli <small>ネロリ</small></h3>
                        <p>軽やかな透明感とやさしい華やかさで、朝の切替や気分リセットに向いています。</p>
                    </article>
                    <article class="catalog-card">
                        <img src="../images/inim-dx_items/aroma_vanilla.png" alt="Aroma Vanilla">
                        <h3>Vanilla <small>バニラ</small></h3>
                        <p>穏やかな甘さと丸みのある余韻で、夜のリラックスタイムに寄り添う香りです。</p>
                    </article>
                    <article class="catalog-card">
                        <img src="../images/inim-dx_items/aroma_musk.png" alt="Aroma Musk">
                        <h3>Musk <small>ムスク</small></h3>
                        <p>落ち着きのある奥行きで、集中したい時間や空間の調整に使いやすい一本です。</p>
                    </article>
                </div>
            </section>
        </section>
    </main>
    <script src="../js/site-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/site-shell.js"></script>
</body>

</html>
